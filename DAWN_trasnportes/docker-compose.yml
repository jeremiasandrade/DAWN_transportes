services:
  dawn_transportes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dawn_transportes_app
    restart: always
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb_database
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-dawn_transportes}
      - DB_USERNAME=${DB_USERNAME:-Jeremias}
      - DB_PASSWORD=${DB_PASSWORD:-197328}
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_ENCRYPTION=null
    depends_on:
      - mariadb_database
      - mailpit
    networks:
      - dawn_network

  nginx_web:
    image: nginx:alpine
    container_name: dawn_transportes_nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dawn_transportes
    networks:
      - dawn_network

  mariadb_database:
    image: docker.io/library/mariadb:10.11
    container_name: dawn_transportes_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dawn_transportes}
      MYSQL_USER: ${DB_USERNAME:-Jeremias}
      MYSQL_PASSWORD: ${DB_PASSWORD:-197328}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-197328}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dawn_network

  mailpit:
    image: axllent/mailpit
    container_name: dawn_transportes_mailpit
    restart: always
    ports:
      - "1025:1025" # Puerto SMTP
      - "8025:8025" # Interfaz Web para ver correos
    networks:
      - dawn_network

volumes:
  mariadb_data:

networks:
  dawn_network:
    driver: bridge