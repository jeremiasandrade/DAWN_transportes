apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: "dawn_transportes"
        - name: MYSQL_USER
          value: "Jeremias"
        - name: MYSQL_PASSWORD
          value: "197328"
        - name: MYSQL_ROOT_PASSWORD
          value: "197328"
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  type: ClusterIP # Solo accesible internamente por el clúster
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: mariadb