apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawn-transportes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dawn-transportes
  template:
    metadata:
      labels:
        app: dawn-transportes
    spec:
      containers:
      - name: laravel-container
        image: ghcr.io/jeremiasandrade/dawn-transportes:latest
        ports:
        - containerPort: 80
        env:
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: "mariadb-service" # Nombre del servicio creado arriba
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "dawn_transportes"
        - name: DB_USERNAME
          value: "Jeremias"
        - name: DB_PASSWORD
          value: "197328"
---
apiVersion: v1
kind: Service
metadata:
  name: dawn-transportes-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: dawn-transportes