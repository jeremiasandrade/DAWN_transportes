name: Build Frontend

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: DAWN_trasnportes

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: DAWN_trasnportes/package-lock.json

    - name: Install NPM dependencies
      run: npm ci

    - name: Build Assets with Vite
      run: npm run build
