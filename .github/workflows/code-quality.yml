name: Code Quality

on: [pull_request]

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: pint

    - name: Install dependencies
      uses: ramsey/composer-install@v3

    - name: Check Code Style with Laravel Pint
      run: vendor/bin/pint --test
